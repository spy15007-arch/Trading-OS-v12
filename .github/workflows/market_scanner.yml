name: Trading OS v12 Scanner

on:
  workflow_dispatch:

  schedule:
    # 3:45 PM IST = 10:15 UTC
    # Monday-Friday
    - cron: '15 10 * * 1-5'


permissions:
  contents: read


jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 25


    env:

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      PYTHONUNBUFFERED: '1'


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'

          cache: pip


      # ======================================================
      # INSTALL PACKAGES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      # ======================================================
      # RUN SCANNER
      # ======================================================

      - name: Run Trading OS v12 scanner

        run: |

          set -euo pipefail

          python run_scan.py


      # ======================================================
      # SHOW REPORT
      # ======================================================

      - name: Show report in job summary

        if: always()

        run: |

          if [ -f reports/swing_scan.md ]; then

            cat reports/swing_scan.md >> "$GITHUB_STEP_SUMMARY"

          else

            echo "reports/swing_scan.md was not created." >> "$GITHUB_STEP_SUMMARY"

          fi


      # ======================================================
      # UPLOAD REPORT
      # ======================================================

      - name: Upload scan reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: trading-os-v12-reports-${{ github.run_number }}

          path: reports/

          if-no-files-found: warn
