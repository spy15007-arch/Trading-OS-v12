name: Trading OS v12 Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: '45 3 * * 1-5'
    - cron: '45 9 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strict Scanner
        run: python run_scan.py

      - name: Run Aggressive Scanner
        run: python run_aggressive_scan.py

      - name: Run Budget Scanner
        run: python run_budget_scan.py

      - name: Send Telegram Reports
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_push.py

      - name: Commit Reports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Auto update Trading OS v12" || echo "Nothing to commit"
          git push
