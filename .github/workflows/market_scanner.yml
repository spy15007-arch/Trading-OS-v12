name: Trading OS v12 Market Scanner

on:
  workflow_dispatch:

  schedule:
    # Morning scan: 9:30-9:45 IST (04:00-04:15 UTC)
    - cron: "0 4 * * 1-5"

    # Afternoon scan: 14:40-14:45 IST (09:10-09:15 UTC)
    - cron: "10 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Run master swing breakout scanner
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run master swing breakout scanner
        shell: bash
        run: |
          set -euo pipefail

          attempts=0
          max_attempts=3

          until [ "$attempts" -ge "$max_attempts" ]; do
            attempts=$((attempts + 1))
            echo "Scanner attempt $attempts/$max_attempts"

            if python run_scan.py; then
              exit 0
            fi

            echo "Scanner failed. Waiting 180s before retry..."
            sleep 180
          done

          echo "Scanner failed after $max_attempts attempts"
          exit 1

      - name: Commit latest reports to repository
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/swing_scan.csv reports/swing_scan.md
          git commit -m "chore: update swing scan reports [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" --allow-empty
          git push

      - name: Publish Markdown reports in workflow summary
        if: always()
        shell: bash
        run: |
          [ -f reports/swing_scan.md ] && cat reports/swing_scan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-os-v12-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
