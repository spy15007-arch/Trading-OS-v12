name: Trading OS v12 Market Scanner

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Scanner profile to run
        required: true
        default: all
        type: choice
        options:
          - all
          - strict
          - aggressive
          - budget

  schedule:
    # Morning scan: 9:30-9:45 IST (04:00-04:15 UTC)
    - cron: "0 4 * * 1-5"
    
    # Afternoon scan: 14:40-14:45 IST (09:10-09:15 UTC)
    - cron: "10 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Run ${{ inputs.profile || 'all' }} scanner
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SELECTED_PROFILE: ${{ inputs.profile || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify aiohttp installed
        run: python -c "import aiohttp, sys; print('aiohttp', aiohttp.__version__)"

      - name: Run selected scanner
        run: python run_scan.py --profile "$SELECTED_PROFILE"

      - name: Commit latest reports to repository
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/00_LATEST_STRICT.csv
          git add reports/00_LATEST_STRICT.md
          git add reports/01_LATEST_AGGRESSIVE.csv
          git add reports/01_LATEST_AGGRESSIVE.md
          git add reports/02_LATEST_BUDGET.csv
          git add reports/02_LATEST_BUDGET.md
          git add reports/.last_scan

          # Always commit with timestamp, even if content is unchanged
          git commit -m "chore: update scanner reports [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" --allow-empty
          git push

      - name: Publish Markdown reports in workflow summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob

          for report in reports/00_LATEST_*.md; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload timestamped and latest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-os-v12-reports-${{ github.run_id }}
          path: |
            reports/*.csv
            reports/*.md
          if-no-files-found: warn
          retention-days: 30
