name: Trading OS v12 Market Scanner

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Scanner profile to run
        required: true
        default: all
        type: choice
        options:
          - all
          - strict
          - aggressive
          - budget

  schedule:
    # 16:15 IST, Monday-Friday — after NSE cash-market close.
    # GitHub Actions cron uses UTC.
    - cron: "45 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: trading-os-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Run ${{ inputs.profile || 'all' }} scanner
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SELECTED_PROFILE: ${{ inputs.profile || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run selected scanner
        run: python run_scan.py --profile "$SELECTED_PROFILE"

      - name: Publish Markdown reports in workflow summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for report in reports/*.md; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload CSV and Markdown reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-os-v12-reports-${{ github.run_id }}
          path: |
            reports/*.csv
            reports/*.md
          if-no-files-found: warn
          retention-days: 30
