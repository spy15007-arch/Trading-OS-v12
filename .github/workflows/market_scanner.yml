name: Trading OS v12 Market Scanner

on:
  workflow_dispatch:
    inputs:
      scan:
        description: Scanner to run
        required: true
        default: strict
        type: choice
        options:
          - strict
          - aggressive
          - budget

  schedule:
    # 17:00 IST, Monday-Friday (after NSE market close).
    - cron: "30 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: trading-os-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.scan }}" in
              strict)
                python run_scan.py
                ;;
              aggressive)
                python run_aggressive_scan.py
                ;;
              budget)
                python run_budget_scan.py
                ;;
            esac
          else
            python run_scan.py
          fi

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-os-v12-report-${{ github.run_id }}
          path: reports/*.csv
          if-no-files-found: warn
          retention-days: 30
