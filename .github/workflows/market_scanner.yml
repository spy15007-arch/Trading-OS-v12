name: Trading OS v12 Scanner

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Choose what the manual run should do"
        required: true
        type: choice
        default: MANUAL
        options:
          - MANUAL
          - MIDDAY_RADAR
          - CLOSE_CONFIRMATION

  schedule:
    # 1:15 PM IST: early radar (daily-bar volume is provisional intraday).
    - cron: '45 7 * * 1-5'
    # 3:45 PM IST: after-close scan for final daily-candle confirmation.
    - cron: '15 10 * * 1-5'


permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 40


    env:

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      PYTHONUNBUFFERED: '1'
      SCAN_MODE: ${{ github.event.schedule == '45 7 * * 1-5' && 'MIDDAY_RADAR' || github.event.schedule == '15 10 * * 1-5' && 'CLOSE_CONFIRMATION' || inputs.scan_mode || 'MANUAL' }}


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'

          cache: pip


      # ======================================================
      # INSTALL PACKAGES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      # ======================================================
      # CHECK PYTHON SYNTAX
      # ======================================================

      - name: Check Python syntax
        run: python -m compileall -q run_scan.py telegram_push.py app.py scanner


      - name: Test trade outcome tracker
        run: python -m unittest discover -s tests -v


      # ======================================================
      # RUN SCANNER
      # ======================================================

      - name: Run Trading OS v12 scanner

        run: |

          set -euo pipefail

          python run_scan.py


      # ======================================================
      # PUBLISH LATEST REPORTS FOR STREAMLIT
      # ======================================================

      - name: Commit latest scan reports
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/swing_scan.csv reports/swing_scan.md reports/scan_summary.json reports/telegram_dedupe_state.json
          if [ -f reports/data_coverage.csv ]; then git add reports/data_coverage.csv; fi
          if [ -f reports/trade_outcomes.csv ]; then git add reports/trade_outcomes.csv; fi
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Refresh latest Trading OS v12 scan reports"
            git push
          fi


      # ======================================================
      # SHOW REPORT
      # ======================================================

      - name: Show report in job summary

        if: always()

        run: |

          if [ -f reports/swing_scan.md ]; then

            cat reports/swing_scan.md >> "$GITHUB_STEP_SUMMARY"

          else

            echo "reports/swing_scan.md was not created." >> "$GITHUB_STEP_SUMMARY"

          fi


      # ======================================================
      # UPLOAD REPORT
      # ======================================================

      - name: Upload scan reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: trading-os-v12-reports-${{ github.run_number }}

          path: reports/

          if-no-files-found: warn
          retention-days: 4
